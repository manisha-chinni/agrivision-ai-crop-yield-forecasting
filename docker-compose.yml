services:
  backend:
    build: ./backend
    environment:
      DATA_PROVIDER: ${DATA_PROVIDER:-demo}
      GOOGLE_EARTH_ENGINE_PROJECT: ${GOOGLE_EARTH_ENGINE_PROJECT:-}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
